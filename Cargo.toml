[package]
name = "humon"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yldrmzffr/humon"
publish = false

[dependencies]
gpui-kit = "0.7"
mongodb = "3.9.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rust-i18n = "4.2.4"
sys-locale = "0.3"
rquickjs = "0.14"

[profile.release]
debug = false
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
