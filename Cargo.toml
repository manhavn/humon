[package]
name = "humon"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A small, fast MongoDB client for the desktop, built with gpui"
license = "MIT"
readme = "README.md"
keywords = ["mongodb", "gui", "database", "client", "gpui"]
categories = ["database", "gui"]
repository = "https://github.com/yldrmzffr/humon"
publish = false

[dependencies]
gpui-kit = "0.7"
mongodb = "3.9.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rust-i18n = "4.2.4"
sys-locale = "0.3"
rquickjs = "0.14"
futures-channel = "0.3"
# Completion types for gpui-component's editor; already built as its dependency.
lsp-types = "0.97"
anyhow = "1"

[profile.release]
debug = false
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
