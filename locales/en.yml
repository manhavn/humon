settings.schema: Field suggestions
settings.schema_sample: Documents sampled per collection to learn its fields
settings.schema_hint: More documents find rare fields but take longer and put more load on the server. Fewer are faster but may miss fields only some documents have. Documents are read one by one and not kept, so memory use stays the same.
settings.discover: Also search the whole collection for fields the sample missed
settings.discover_hint: After sampling, humon asks the server for documents that don't fit what it has seen, until none are left. Rare fields and types are found, and warnings can say a field exists nowhere. These queries can't use an index, so each is limited to 5 seconds and all of them to 20.
