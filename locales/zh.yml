settings.discover: 同时在整个集合中搜索采样遗漏的字段
settings.discover_hint: 采样完成后，humon 会向服务器查询与已见结构不符的文档，直到没有为止。这样可以发现少见的字段和类型，警告也能指出某个字段在任何文档中都不存在。这些查询无法使用索引，因此每个查询限时 5 秒，总计限时 20 秒。
