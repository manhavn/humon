settings.schema_hint: Más documentos encuentran campos poco comunes, pero tardan más y cargan más el servidor. Menos documentos son más rápidos, pero pueden pasar por alto campos que solo tienen algunos documentos. Los documentos se leen uno a uno y no se guardan, así que el uso de memoria no cambia.
settings.discover: Buscar también en toda la colección los campos que la muestra no encontró
settings.discover_hint: Tras el muestreo, humon pide al servidor documentos que no encajan con lo que ya ha visto, hasta que no quede ninguno. Así se encuentran campos y tipos poco comunes, y las advertencias pueden indicar que un campo no existe en ningún documento. Estas consultas no pueden usar un índice, así que cada una se limita a 5 segundos y todas juntas a 20.
