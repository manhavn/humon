settings.schema_sample: عدد المستندات المأخوذة كعيّنة من كل مجموعة للتعرّف على حقولها
settings.schema_hint: المزيد من المستندات يكشف الحقول النادرة لكنه يستغرق وقتًا أطول ويزيد الحمل على الخادم. والعدد الأقل أسرع لكنه قد يُغفل حقولًا لا توجد إلا في بعض المستندات. تُقرأ المستندات واحدًا تلو الآخر ولا يُحتفظ بها، لذا يبقى استخدام الذاكرة كما هو.
settings.discover: البحث أيضًا في المجموعة كاملةً عن الحقول التي فاتت العيّنة
settings.discover_hint: بعد أخذ العيّنة، يطلب humon من الخادم المستندات التي لا تطابق ما رآه، حتى لا يتبقى شيء. فتُكتشف الحقول والأنواع النادرة، ويمكن للتحذيرات أن تبيّن أن حقلًا غير موجود في أي مكان. لا يمكن لهذه الاستعلامات استخدام فهرس، لذا يُحدّ كل منها بـ 5 ثوانٍ ومجموعها بـ 20.
