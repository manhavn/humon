settings.schema: Suggestions de champs
settings.schema_sample: Documents échantillonnés par collection pour apprendre ses champs
settings.schema_hint: Plus de documents trouvent les champs rares, mais prennent plus de temps et chargent davantage le serveur. Moins de documents vont plus vite, mais peuvent manquer des champs présents dans quelques documents seulement. Les documents sont lus un par un et non conservés, donc la mémoire utilisée reste la même.
settings.discover: Rechercher aussi dans toute la collection les champs manqués par l'échantillon
settings.discover_hint: Après l'échantillonnage, humon demande au serveur les documents qui ne correspondent pas à ce qu'il a vu, jusqu'à ce qu'il n'en reste plus. Les champs et types rares sont trouvés, et les avertissements peuvent indiquer qu'un champ n'existe nulle part. Ces requêtes ne peuvent pas utiliser d'index, donc chacune est limitée à 5 secondes et l'ensemble à 20.
