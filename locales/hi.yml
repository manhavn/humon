settings.schema_sample: फ़ील्ड पहचानने के लिए हर कलेक्शन से सैंपल किए जाने वाले डॉक्यूमेंट
settings.schema_hint: ज़्यादा डॉक्यूमेंट से दुर्लभ फ़ील्ड भी मिल जाते हैं, पर समय ज़्यादा लगता है और सर्वर पर लोड बढ़ता है। कम डॉक्यूमेंट तेज़ हैं, पर वे फ़ील्ड छूट सकते हैं जो सिर्फ़ कुछ डॉक्यूमेंट में हैं। डॉक्यूमेंट एक-एक करके पढ़े जाते हैं और रखे नहीं जाते, इसलिए मेमोरी का उपयोग उतना ही रहता है।
settings.discover: सैंपल में छूटे फ़ील्ड के लिए पूरे कलेक्शन में भी खोजें
settings.discover_hint: सैंपलिंग के बाद humon सर्वर से ऐसे डॉक्यूमेंट माँगता है जो अब तक देखे गए से मेल नहीं खाते, जब तक कोई न बचे। इससे दुर्लभ फ़ील्ड और टाइप मिल जाते हैं, और चेतावनी बता सकती है कि कोई फ़ील्ड कहीं मौजूद नहीं है। ये क्वेरी इंडेक्स का उपयोग नहीं कर सकतीं, इसलिए हर एक 5 सेकंड तक और सभी मिलाकर 20 सेकंड तक सीमित हैं।
